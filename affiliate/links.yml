# Справочник партнёрских ссылок для схемы aff:<ключ> в теле статей.
#
# Формат:
#
#   <ключ>:
#     network: admitad            # admitad | vseinstrumenti | yandex-market | ozon
#     advertiser: "ООО «Рекламодатель»"
#     url: ""                     # пусто, пока ссылка не выдана партнёрской сетью
#     erid: ""                    # пусто, пока не выдан
#     note: "Что за категория/товар, для памяти"
#
# Ключ заводит тот, кто пишет статью, сразу с пустыми url/erid — плагин
# раскроет ссылку сам, как только владелец впишет сюда настоящие url и erid,
# без переимпорта статей. Формат ключа: <магазин>-<категория>, латиница и
# дефисы. Подробности — SCHEMA.md, раздел «Партнёрские ссылки».

